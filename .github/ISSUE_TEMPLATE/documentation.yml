name: Documentation
description: Report unclear, incorrect, or missing public CLI documentation.
title: '[Docs] '
labels: ['documentation']
body:
  - type: input
    id: page
    attributes:
      label: Page or section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
