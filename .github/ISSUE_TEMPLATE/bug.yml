name: CLI bug
description: Report a reproducible bug in the public Noxgild bootstrap CLI.
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Do not include passwords, tokens, pairing secrets, private keys, or sensitive screenshots.'
  - type: input
    id: version
    attributes:
      label: CLI version
      placeholder: '1.0.1'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Architecture
      placeholder: 'x64 or arm64'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
